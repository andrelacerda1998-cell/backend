name: Reindexar os profissionais

# Reconstrói o índice de pesquisa dos profissionais a partir da base de dados.
#
# PORQUE EXISTE: a 30/09 a procura imediata passou a filtrar por `at_em_dia`
# (VendorSearchService: `->where("at_em_dia", true)`). É um campo NOVO, e os
# documentos que já estavam no índice não o têm. No Meilisearch, filtrar por um
# campo que o documento não tem EXCLUI o documento -- por isso o índice podia
# estar cheio e a procura responder zero. Isto reescreve os documentos para que
# passem a trazer o campo.
#
# O NÚMERO A OLHAR NÃO É 464, e a versão anterior deste ficheiro dizia que era.
# Estava errado: o `shouldBeSearchable()` do Vendor exige telefone e email
# verificados, documentos todos validados, IBAN, workspace de faturação e a AT
# em dia. Em produção isso dá cerca de 70 profissionais, não 464. Um índice com
# ~83 documentos para 464 registados NÃO é um índice faminto -- é o que as
# regras do produto mandam. Quem olhasse para "83 de 464" ia à procura de um
# problema que não existe.
#
# NÃO É A CURA da procura imediata. Há uma segunda razão, mais antiga, para dar
# zero: o filtro `geoTime >= agora - location_update_threshold`. A 01/10 só UM
# profissional tinha localização dentro dessa janela, e o zero já aparecia no
# diagnóstico de 25/09 -- antes de o `at_em_dia` existir. Reindexar não mexe
# nisso: as localizações vêm da app, não do índice.

on:
  workflow_dispatch:

# ENTRA no grupo do deploy, ao contrário dos workflows de leitura.
#
# Isto ESCREVE no índice, e um deploy a meio de uma reindexação deixaria metade
# dos documentos com o formato antigo e metade com o novo -- e a diferença só
# se notaria quando um cliente não encontrasse ninguém.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reindexar:
    name: Reindexar os profissionais
    runs-on: ubuntu-latest
    # 464 profissionais demoram pouco, mas a fila pode estar carregada.
    timeout-minutes: 30
    # Traz o portão de aprovação manual, que aqui faz ainda mais sentido do que
    # nos workflows de leitura: isto escreve.
    environment: production
    steps:
      - name: Reconstruir o índice a partir da base de dados
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          # O comando é FIXO neste ficheiro, e NÃO um input do workflow. Aceitar
          # um comando por parâmetro transformava este botão numa shell remota
          # para produção à espera de ser usada. É a mesma regra dos workflows
          # de leitura.
          script: |
            set -uo pipefail
            cd ~/project-laravel

            ART="docker compose exec -T laravel-prod php artisan"

            # SEM `set -e`, e de propósito.
            #
            # Duas corridas falharam com "Process exited with status 255" e
            # NENHUMA mensagem, mesmo com `2>&1` no comando. Com `set -e` o
            # bash morre no instante em que o comando falha, e o que o
            # `ssh-action` ainda tinha em buffer vai com ele. Captura-se a saída
            # numa variável e imprime-se DEPOIS, num comando que não falha --
            # assim a mensagem de erro chega sempre.
            ALGO_FALHOU=0
            correr() {
              local nome="$1"; shift
              local saida codigo
              saida=$("$@" 2>&1); codigo=$?
              echo "$saida"
              if [ "$codigo" -ne 0 ]; then
                echo ">>> ${nome} FALHOU com código ${codigo}"
                ALGO_FALHOU=1
              fi
              return "$codigo"
            }

            echo "=============================================="
            echo " ANTES"
            echo "=============================================="
            # A MESMA forma de contar que o `ler-estado-da-procura-imediata`
            # usa. Inventar uma segunda maneira de contar a mesma coisa é
            # exactamente o que já custou dois dias noutros sítios.
            #
            # `elegiveis` é o número que o índice DEVE ter: é a contagem, na
            # base de dados, de quem passa o `shouldBeSearchable()`. É contra
            # este número que a contagem de documentos se compara -- não contra
            # o total de profissionais.
            correr "contagem inicial" $ART tinker --execute='
              $idx = app(Meilisearch\Client::class)->index("vendors");
              echo "documentos no indice  = " . $idx->stats()["numberOfDocuments"] . PHP_EOL;
              echo "profissionais na base = " . App\Models\Vendor::count() . PHP_EOL;
              echo "com at_em_dia         = " . $idx->search("", ["filter" => "at_em_dia = true", "limit" => 1])->getEstimatedTotalHits() . PHP_EOL;
              // POR LOTES, e não `->get()` de uma vez. A primeira versão
              // carregava os 464 com as relações e avaliava `shouldBeSearchable()`
              // em cada um; morria com código 255 e SEM mensagem -- o feitio de
              // uma morte por memória, que não passa pelo tratamento de erros do
              // PHP e por isso não escreve nada. O passo ficava vermelho depois
              // de a reindexação ter corrido bem.
              $elegiveis = 0;
              App\Models\Vendor::query()->with("user")->chunkById(50, function ($lote) use (&$elegiveis) {
                  $elegiveis += $lote->filter->shouldBeSearchable()->count();
              });
              echo "elegiveis na base     = " . $elegiveis . PHP_EOL;
            '

            echo
            echo "=============================================="
            echo " DEFINIÇÕES DO ÍNDICE"
            echo "=============================================="
            # Primeiro as definições, depois os documentos: um campo novo só é
            # filtrável se estiver nos filterableAttributes, e reindexar antes
            # disso deixava o índice cheio e na mesma sem conseguir filtrar.
            correr "scout:sync-index-settings" $ART scout:sync-index-settings

            echo
            echo "=============================================="
            echo " A REINDEXAR"
            echo "=============================================="
            # NÃO se usa `scout:import`, e a razão é a fila.
            #
            # O `config/scout.php` tem `"queue" => env("SCOUT_QUEUE", true)`. Com
            # a fila ligada, o `scout:import` não escreve no índice: despacha
            # jobs. E a fila desta instalação tem centenas de jobs falhados, o
            # mais recente de 20/07 -- ou seja, o comando dizia "importado" e o
            # índice não mudava. Aqui força-se `scout.queue = false` para a
            # escrita ser SÍNCRONA: quando este passo acabar, o índice já mudou,
            # e a contagem do fim prova-o.
            #
            # Por lotes, e cada lote com rede: se um profissional rebentar a
            # serializar, tenta-se um a um para que os outros entrem e para se
            # saber QUAL é o que rebenta. Um import que morre a meio e não diz
            # onde é o que deixa um índice com 83 documentos e ninguém a saber
            # porquê.
            correr "reindexação" $ART tinker --execute='
              config(["scout.queue" => false]);
              $feitos = 0; $falhas = [];
              App\Models\Vendor::query()->chunkById(50, function ($lote) use (&$feitos, &$falhas) {
                  $aIndexar = $lote->filter->shouldBeSearchable();
                  if ($aIndexar->isEmpty()) { return; }
                  try {
                      $aIndexar->searchable();
                      $feitos += $aIndexar->count();
                  } catch (\Throwable $e) {
                      foreach ($aIndexar as $v) {
                          try { $v->searchable(); $feitos++; }
                          catch (\Throwable $e2) { $falhas[$v->id] = get_class($e2) . ": " . $e2->getMessage(); }
                      }
                  }
              });
              echo "escritos no indice = " . $feitos . PHP_EOL;
              echo "falhas             = " . count($falhas) . PHP_EOL;
              foreach ($falhas as $id => $m) { echo "  vendor " . $id . " -> " . mb_substr($m, 0, 200) . PHP_EOL; }
            '

            echo
            echo "=============================================="
            echo " DEPOIS"
            echo "=============================================="
            # A PROVA, e o que cada linha quer dizer:
            #
            #  - `documentos` perto de `elegiveis` = o índice está no sítio. Se
            #    sobrarem documentos a mais, são de quem já não é elegível (um
            #    documento que caducou, por exemplo). Ficam a dizer que sobram;
            #    APAGAR do índice muda quem o cliente encontra, e essa decisão
            #    não é deste botão.
            #  - `com at_em_dia` TEM de passar a ser igual a `documentos`. É
            #    este o campo por onde a procura filtra desde 30/09, e era esta
            #    a razão de existir desta reindexação. Se ficar a zero, não se
            #    ganhou nada.
            #  - `dentro da janela` é a outra metade do problema, e esta
            #    reindexação NÃO a resolve: é quem tem localização fresca o
            #    suficiente para a procura imediata o considerar. As
            #    localizações vêm da app.
            # ESPERAR QUE O ÍNDICE ASSENTE antes de contar.
            #
            # O Meilisearch aceita os documentos e processa-os depois. A
            # primeira versão contava logo a seguir à escrita e deu números
            # impossíveis: 116 documentos de um índice que tinha 83 e recebeu
            # 72 reescritas, e 40 com `at_em_dia` entre 72 que, por definição
            # do `shouldBeSearchable()`, o têm todos. Não era o índice a estar
            # mal -- era a contagem a ser tirada a meio.
            correr "esperar pelo indice" $ART tinker --execute='
              $idx = app(Meilisearch\Client::class)->index("vendors");
              $esperou = 0;
              while ($esperou < 180) {
                  $s = $idx->stats();
                  if (empty($s["isIndexing"])) break;
                  sleep(3); $esperou += 3;
              }
              echo "esperou " . $esperou . "s pelo indice a assentar" . PHP_EOL;
              if ($esperou >= 180) { echo "AVISO: ainda a indexar -- as contas abaixo sao provisorias" . PHP_EOL; }
            '

            correr "contagem final" $ART tinker --execute='
              $idx = app(Meilisearch\Client::class)->index("vendors");
              $docs = $idx->stats()["numberOfDocuments"];
              $minutos = config("services.request.location_update_threshold");
              $limite = now()->subMinutes($minutos)->timestamp;
              echo "documentos no indice = " . $docs . PHP_EOL;
              $comCampo = $idx->search("", ["filter" => "at_em_dia = true", "limit" => 1])->getEstimatedTotalHits();
              $semAt = $idx->search("", ["filter" => "at_em_dia = false", "limit" => 1])->getEstimatedTotalHits();
              echo "com at_em_dia = true = " . $comCampo . PHP_EOL;
              echo "com at_em_dia = false= " . $semAt . PHP_EOL;
              // A LINHA QUE INTERESSA. Um documento sem o campo nenhum é um
              // documento ANTIGO, por reescrever -- e a procura, que filtra por
              // `at_em_dia`, nunca o devolve. Zero aqui é o objectivo disto.
              echo "SEM o campo (antigos) = " . ($docs - $comCampo - $semAt) . PHP_EOL;
              echo "status Online        = " . $idx->search("", ["filter" => "status = \"Online\"", "limit" => 1])->getEstimatedTotalHits() . PHP_EOL;
              echo "janela = " . $minutos . " min; dentro dela = " . $idx->search("", ["filter" => "geoTime >= " . $limite, "limit" => 1])->getEstimatedTotalHits() . PHP_EOL;
            '

            echo
            echo "jobs falhados na fila (não é o que isto corrige, é contexto):"
            correr "queue:failed" $ART queue:failed | tail -3

            # Sem `set -e`, o passo acabaria VERDE mesmo que a reindexação
            # tivesse rebentado -- e um botão que diz que correu bem sem ter
            # escrito nada é pior do que um que falha. O código de saída volta
            # a depender do que aconteceu.
            exit "$ALGO_FALHOU"

name: Deploy Piquet backend (produção)

# Substitui o pipeline Jenkins da agência.
# Faz: testes -> build da golden image (cache) -> build da app image -> push para ghcr.io -> deploy via SSH.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Fazer deploy em produção no fim (desmarcado = só valida testes/build, não mexe no servidor)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository_owner }}/piquet-laravel-base
  APP_IMAGE_NAME: ${{ github.repository_owner }}/piquet-laravel

jobs:
  test:
    name: Testes (PHPUnit)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: piquet_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout payshop-sdk (irmão, como no composer.json local)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/payshop-sdk
          ref: main
          path: payshop-sdk
          token: ${{ secrets.PAYSHOP_SDK_PAT }}

      - name: Ajustar composer.json para path relativo do CI (../payshop-sdk -> ../payshop-sdk já é válido pois payshop-sdk é irmão de backend no workspace)
        run: echo "payshop-sdk fica em $GITHUB_WORKSPACE/payshop-sdk, backend em $GITHUB_WORKSPACE/backend — o path relativo ../payshop-sdk do composer.json já bate certo"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, redis, gd, intl, pcntl, opcache, zip
          tools: composer:v2

      - name: Composer install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar .env de teste
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i "s/^DB_HOST=.*/DB_HOST=127.0.0.1/" .env
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=piquet_test/" .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=root/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=/" .env
          sed -i "s/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/" .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Rodar migrations + testes
        working-directory: backend
        run: |
          php artisan migrate --force
          php artisan test

  build-base:
    name: Build golden image (base)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      base-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Calcular tag da base (hash do base.Dockerfile)
        id: tag
        run: echo "tag=$(sha256sum infra/docker/base.Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar se esta versão da base já existe no ghcr.io
        id: check
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push base image (só se mudou)
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/base.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-app:
    name: Build + push app image
    needs: build-base
    runs-on: ubuntu-latest
    outputs:
      app-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout backend (raiz do build context)
        uses: actions/checkout@v4

      - name: Checkout payshop-sdk (para dentro de ./payshop-sdk, como o app.Dockerfile espera)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/payshop-sdk
          ref: main
          path: payshop-sdk
          token: ${{ secrets.PAYSHOP_SDK_PAT }}

      - name: Definir tag da app image
        id: tag
        run: echo "tag=${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/app.Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ needs.build-base.outputs.base-tag }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy em produção
    needs: build-app
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Escrever .env de produção a partir do secret
        env:
          ENV_CONTENT: ${{ secrets.PROD_ENV_FILE }}
        run: printf '%s\n' "$ENV_CONTENT" > .env.production

      - name: Copiar .env para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".env.production"
          target: "~/project-laravel/"
          overwrite: true

      - name: Deploy via SSH (login ghcr, atualizar compose, subir)
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ needs.build-app.outputs.app-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd ~/project-laravel
            mv .env.production .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sed -i -E "s#image: .*piquet-laravel.*#image: ${APP_IMAGE}#" docker-compose.yaml
            # IMPORTANTE: pull/up só do serviço laravel-prod (a app). Nunca "docker compose pull"
            # ou "up -d" sem argumento aqui — isso puxa e recria TODOS os serviços do compose,
            # incluindo mysql-laravel-prod/redis-laravel-prod/meilisearch-laravel-prod. Se essas
            # imagens tiverem tag flutuante (ex: "mysql" sem versão), um pull destes puxa a major
            # version mais recente do Docker Hub e recria o container de dados com ela -- ja
            # aconteceu (2026-07-22) e derrubou a base de dados de producao por incompatibilidade
            # de "data dictionary" entre major versions do MySQL. Corrigido nesse dia fixando a
            # tag exata (mysql:9.2.0-piquet-restore) no docker-compose.yaml do servidor -- mas o
            # pipeline nunca deve depender disso: só toca no serviço da app.
            docker compose pull laravel-prod
            docker compose up -d laravel-prod
            docker image prune -f
            docker logout ghcr.io
